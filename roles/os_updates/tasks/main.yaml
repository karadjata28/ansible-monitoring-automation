- name: Ensure node_exporter textfile directory exists
  ansible.builtin.file:
    path: "{{ os_updates_textfile_dir }}"
    state: directory
    owner: "{{ os_updates_user }}"
    group: "{{ os_updates_group }}"
    mode: "0755"

- name: Deploy OS updates exporter script
  ansible.builtin.template:
    src: os_updates.sh.j2
    dest: "{{ os_updates_script_path }}"
    owner: "{{ os_updates_user }}"
    group: "{{ os_updates_group }}"
    mode: "0755"
  notify:
    - run os_updates.service

- name: Deploy os_updates systemd service
  ansible.builtin.template:
    src: os_updates.service.j2
    dest: /etc/systemd/system/os_updates.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon-reload
    - run os_updates.service

- name: Deploy os_updates systemd timer
  ansible.builtin.template:
    src: os_updates.timer.j2
    dest: /etc/systemd/system/os_updates.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon-reload
    - restart os_updates.timer

- name: Ensure os_updates.timer is enabled and started
  ansible.builtin.systemd:
    name: os_updates.timer
    state: started
    enabled: true
    daemon_reload: true
