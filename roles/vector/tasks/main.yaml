---
- name: Set Vector architecture
  ansible.builtin.set_fact:
    vector_arch: "{{ vector_arch_map[ansible_architecture] | default('x86_64-unknown-linux-gnu') }}"

- name: Set Vector archive facts
  ansible.builtin.set_fact:
    vector_archive_name: "vector-{{ vector_version }}-{{ vector_arch }}.tar.gz"
    vector_archive_url: "https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/vector-{{ vector_version }}-{{ vector_arch }}.tar.gz"
    vector_archive_checksum: "{{ vector_checksums[vector_arch] | default(omit) }}"

- name: Ensure Vector group exists
  ansible.builtin.group:
    name: "{{ vector_group }}"
    system: true
    state: present

- name: Ensure Vector user exists
  ansible.builtin.user:
    name: "{{ vector_user }}"
    group: "{{ vector_group }}"
    groups: "{{ vector_supplementary_groups }}"
    append: true
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Vector directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ vector_install_root }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ vector_release_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ vector_config_file | dirname }}"
      owner: "{{ vector_user }}"
      group: "{{ vector_group }}"
      mode: "0755"
    - path: "{{ vector_data_dir }}"
      owner: "{{ vector_user }}"
      group: "{{ vector_group }}"
      mode: "0755"

- name: Download Vector archive
  ansible.builtin.get_url:
    url: "{{ vector_archive_url }}"
    dest: "/tmp/{{ vector_archive_name }}"
    checksum: "{{ vector_archive_checksum }}"
    mode: "0644"

- name: Extract Vector archive
  ansible.builtin.unarchive:
    src: "/tmp/{{ vector_archive_name }}"
    dest: "{{ vector_release_dir }}"
    remote_src: true
    extra_opts:
      - "--strip-components=1"
    creates: "{{ vector_release_dir }}/bin/vector"

- name: Symlink Vector binary
  ansible.builtin.file:
    src: "{{ vector_release_dir }}/bin/vector"
    dest: /usr/local/bin/vector
    state: link
    force: true

- name: Deploy Vector config
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_file }}"
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: "0644"
  notify: restart vector

- name: Install Vector systemd unit
  ansible.builtin.template:
    src: vector.service.j2
    dest: /etc/systemd/system/vector.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon-reload
    - restart vector

- name: Enable and start Vector
  ansible.builtin.systemd:
    name: vector
    enabled: true
    state: started
    daemon_reload: true
