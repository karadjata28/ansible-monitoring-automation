---
- name: "Ensure victorialogs group exists"
  ansible.builtin.group:
    name: "{{ victorialogs_group }}"
    system: true
  tags: [users]

- name: "Ensure victorialogs user exists"
  ansible.builtin.user:
    name: "{{ victorialogs_user }}"
    group: "{{ victorialogs_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  tags: [users]

- name: "Ensure binary directory exists"
  ansible.builtin.file:
    path: "{{ victorialogs_bin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [filesystem]

- name: "Create required directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ victorialogs_user }}"
    group: "{{ victorialogs_group }}"
    mode: "0755"
  loop:
    - "{{ victorialogs_data_dir }}"
    - "{{ victorialogs_log_dir }}"
  tags: [filesystem]

- name: "Set default binary name"
  ansible.builtin.set_fact:
    victorialogs_binary_name: "{{ victorialogs_binary_name | default('victoria-logs-prod') }}"
  tags: [install]

- name: "Check if binary already installed"
  ansible.builtin.stat:
    path: "{{ victorialogs_bin_dir }}/{{ victorialogs_binary_name }}"
  register: _vl_bin
  tags: [install]

- name: "Download VictoriaLogs artifact (when URL provided)"
  when:
    - victorialogs_binary_url is defined
    - not _vl_bin.stat.exists
  block:
    - name: "Clear previous unpack directory"
      ansible.builtin.file:
        path: "{{ victorialogs_unpack_dir }}"
        state: absent

    - name: "Create unpack directory"
      ansible.builtin.file:
        path: "{{ victorialogs_unpack_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Fetch artifact"
      ansible.builtin.get_url:
        url: "{{ victorialogs_binary_url }}"
        dest: "/tmp/victorialogs.{{ 'tar.gz' if (victorialogs_binary_is_archive | default(true)) else 'bin' }}"
        mode: "0644"
        checksum: "{{ victorialogs_checksum | default(omit) }}"
      register: _vl_download

    - name: "Unpack archive"
      when: victorialogs_binary_is_archive | default(true)
      ansible.builtin.unarchive:
        src: "{{ _vl_download.dest }}"
        dest: "{{ victorialogs_unpack_dir }}"
        remote_src: true
      register: _vl_unpack

    - name: "Locate binary in unpacked dir"
      when: victorialogs_binary_is_archive | default(true)
      ansible.builtin.find:
        paths: "{{ victorialogs_unpack_dir }}"
        file_type: file
        patterns: "{{ victorialogs_binary_name }}*"
      register: _vl_found

    - name: "Fail if VictoriaLogs binary was not found"
      when:
        - victorialogs_binary_is_archive | default(true)
        - (_vl_found.files | length) == 0
      ansible.builtin.fail:
        msg: "No {{ victorialogs_binary_name }} binary found in {{ victorialogs_binary_url }}"

    - name: "Install binary from archive"
      when:
        - victorialogs_binary_is_archive | default(true)
        - (_vl_found.files | length) > 0
      ansible.builtin.copy:
        src: "{{ (_vl_found.files | sort(attribute='path'))[0].path }}"
        dest: "{{ victorialogs_bin_dir }}/{{ victorialogs_binary_name }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: ["restart victorialogs"]

    - name: "Install binary from direct file"
      when: not (victorialogs_binary_is_archive | default(true))
      ansible.builtin.copy:
        src: "{{ _vl_download.dest }}"
        dest: "{{ victorialogs_bin_dir }}/{{ victorialogs_binary_name }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: ["restart victorialogs"]
  tags: [install]

- name: "Ensure binary has correct perms if already present"
  when: _vl_bin.stat.exists
  ansible.builtin.file:
    path: "{{ victorialogs_bin_dir }}/{{ victorialogs_binary_name }}"
    owner: root
    group: root
    mode: "0755"
  tags: [install]

- name: "Install systemd unit"
  ansible.builtin.template:
    src: "victorialogs.service.j2"
    dest: "/etc/systemd/system/victorialogs.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - "daemon-reload"
    - "restart victorialogs"
  tags: [service]

- name: "Ensure service enabled and started"
  ansible.builtin.systemd:
    name: victorialogs
    enabled: true
    state: started
    daemon_reload: true
  tags: [service]
