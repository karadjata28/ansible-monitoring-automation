---
- name: Remove Prometheus package if installed by OS package manager
  ansible.builtin.package:
    name: prometheus
    state: absent

- name: Ensure Prometheus group exists
  ansible.builtin.group:
    name: "{{ prometheus_group }}"
    system: true
    state: present

- name: Ensure Prometheus user exists
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ prometheus_install_root }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ prometheus_install_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ prometheus_config_dir }}"
      owner: "{{ prometheus_user }}"
      group: "{{ prometheus_group }}"
      mode: "0755"
    - path: "{{ prometheus_data_dir }}"
      owner: "{{ prometheus_user }}"
      group: "{{ prometheus_group }}"
      mode: "0755"

- name: Download Prometheus archive
  ansible.builtin.get_url:
    url: "{{ prometheus_archive_url }}"
    dest: "/tmp/{{ prometheus_archive_name }}"
    checksum: "{{ prometheus_archive_checksum }}"
    mode: "0644"

- name: Extract Prometheus archive
  ansible.builtin.unarchive:
    src: "/tmp/{{ prometheus_archive_name }}"
    dest: "{{ prometheus_install_dir }}"
    remote_src: true
    extra_opts:
      - "--strip-components=1"
    creates: "{{ prometheus_install_dir }}/prometheus"

- name: Symlink Prometheus binary
  ansible.builtin.file:
    src: "{{ prometheus_install_dir }}/prometheus"
    dest: /usr/local/bin/prometheus
    state: link
    force: true

- name: Symlink promtool binary
  ansible.builtin.file:
    src: "{{ prometheus_install_dir }}/promtool"
    dest: /usr/local/bin/promtool
    state: link
    force: true

- name: Deploy Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_file }}"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0644"
  notify: restart prometheus

- name: Install Prometheus systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon-reload
    - restart prometheus

- name: Enable and start Prometheus
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true
